name: Auto Update Repository

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 10 * * *"
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "nimesh-kavinda"
          git config user.email "nimeshkavindakarunasinghe@gmail.com"

      - name: Update timestamp
        run: |
          echo "Last Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > LAST_UPDATED.md

      - name: Commit Changes
        run: |
          git add LAST_UPDATED.md

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          messages=(
            "Update portfolio timestamp"
            "Improve portfolio content"
            "Update project information"
            "Refine portfolio layout"
            "Update project details"
            "Enhance portfolio"
            "Apply minor improvements"
          )

          random_index=$((RANDOM % ${#messages[@]}))
          commit_message="${messages[$random_index]}"

          git commit -m "$commit_message"

      - name: Push Changes
        run: |
          git push origin main